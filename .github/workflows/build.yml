name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 7
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '7.0.x'

      - name: Check files
        run: |
          Write-Host "Current directory:"
          Get-Location
          Write-Host "Files:"
          Get-ChildItem -Force
          Write-Host "Icon:"
          Get-Item tpscale.ico

      - name: Restore
        run: dotnet restore WeightDatabaseManager.csproj --verbosity normal

      - name: Publish Self-Contained EXE
        run: >
          dotnet publish WeightDatabaseManager.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o ./publish
          --verbosity normal

      - name: Show publish files
        run: |
          Write-Host "Publish folder:"
          Get-ChildItem ./publish -Force

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: WeightDatabaseManager-win-x64
          path: ./publish/
