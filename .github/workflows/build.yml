name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 7
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '7.0.x'

      - name: Restore
        run: dotnet restore WeightDatabaseManager.csproj

      - name: Publish Self-Contained EXE
        run: >
          dotnet publish WeightDatabaseManager.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o ./publish

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: WeightDatabaseManager-win-x64
          path: ./publish/
